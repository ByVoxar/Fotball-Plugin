# Football 1.0.10 - Spigot/Paper 1.21-1.21.1
# Tüm süre değerleri saniye, fizik cooldown değerleri tick cinsindedir.
# Renkler: &a / &l / &r, &#RRGGBB, &x&R&R&G&G&B&B, <#RRGGBB>, {#RRGGBB>,
# #RRGGBB ve <red>/<blue>/<bold>/<reset> gibi basit etiketler desteklenir.

match:
  start-delay-seconds: 10
  duration-seconds: 300
  goal-limit: 5
  default-min-players: 2
  default-max-players: 14
  goal-reset-delay-ticks: 40

  # Normal süre berabere biterse (örn. 4-4) uzatma başlar.
  # Uzatma yalnızca 1 kez verilir. Uzatma sonunda da eşitse maç berabere biter.
  regular-time-display-name: "&aNormal Süre"
  overtime:
    enabled: true
    duration-seconds: 300
    # true ise uzatma başladığında goal-limit maçı erken bitirmez; tam uzatma süresi oynanır.
    ignore-goal-limit: true
    display-name: "&#FFD84D&lUZATMA"


# Gol atan oyuncunun hemen üstünde hasarsız görsel havai fişek patlar.
goal-celebration:
  firework:
    enabled: true
    height: 2.6
    detonate-delay-ticks: 1
    type: BALL_LARGE
    flicker: true
    trail: true
    # RGB biçimi: R,G,B
    red-color: "255,55,55"
    blue-color: "55,110,255"
    fade-color: "255,255,255"

ball:
  material: SLIME_BLOCK
  custom-model-data: 0
  transform: FIXED
  physics:
    normal-hit-force: 0.85
    shift-hit-force: 1.05
    upward-force: 0.62
    gravity: 0.045
    air-drag: 0.985
    ground-friction: 0.90
    bounce-factor: 0.55
    max-speed: 2.40
    contact-radius: 1.35
    hit-cooldown-ticks: 6
    # Top arenadan çok uzaklaşırsa/boşluğa düşerse spawn noktasına döner.
    reset-distance: 80.0
  particle:
    enabled: true
    type: CRIT
    count: 2
    minimum-speed: 0.08
    dust:
      red: 255
      green: 255
      blue: 255
      size: 1.0



# Arena içi sohbet tamamen arena üyelerine özeldir.
chat:
  enabled: true
  # true: Arena içindekiler dışarıdaki global sohbeti de görmez.
  isolate-global-chat: true
  log-to-console: true
  allow-player-color-codes: false
  format: "&8[&6%arena%&8] %team% &f%player% &8» &f%message%"
  spectator-format: "&8[&6%arena%&8] &7[İzleyici] &f%player% &8» &7%message%"
  spectator-label: "&7İzleyici"

# TAB header/footer yalnızca arena içindeki oyuncunun ekranına uygulanır.
# Takım prefixleri arena scoreboard'u üzerinden TAB isimlerine yansır.
tab:
  enabled: true
  # Başka bir TAB eklentisi Football görünümünü ezmeye çalışırsa arena TAB'ını
  # tekrar uygular. NEZNAMY/TAB kuruluysa otomatik olarak onun API'si kullanılır.
  force-refresh-ticks: 5
  spectator-name: "&7İzleyici"
  player-name: "&f%player%"

  # Arena oyuncularının TAB satırları takımına göre özel görünür.
  # Prefix/suffix scoreboard üzerinden sadece bu arena arayüzünü kullanan oyunculara uygulanır.
  team-prefix:
    red: "&c&lKIRMIZI &8│ &f"
    blue: "&9&lMAVİ &8│ &f"
    spectator: "&7&lİZLEYİCİ &8│ &f"
  team-suffix:
    red: " &8│ &c%red%"
    blue: " &8│ &9%blue%"
    spectator: " &8│ &7SPEC"

  header:
    - " "
    - "&6&lFOOTBALL"
    - "&8"
    - "&7Arena &8» &f%arena%"
    - "&#FF4B4B&l%red% &8- &#4B7BFF&l%blue% &8• &#FFD84D%time%"
    - "&7Devre &8» %phase%"
  footer:
    - "&8"
    - "&7Takımın &8» %team%"
    - "&7Oyuncu &8» &f%players%/%max% &8• &7İzleyici &8» &f%spectators%"
    - " "

scoreboard:
  enabled: true
  update-ticks: 20
  title: "&#FFD84D&lFOOTBALL"
  waiting-time-text: "Bekliyor"
  overtime-state-text: "&#FFD84D&lUzatma"
  lines:
    - "&7Arena: &f%arena%"
    - " "
    - "&cKırmızı: &f%red%"
    - "&9Mavi: &f%blue%"
    - "  "
    - "&7Süre: &f%time%"
    - "&7Devre: %phase%"
    - "&7Durum: &f%state%"
    - "&7Takım: %team%"
    - "   "
    - "&7Oyuncular: &f%players%/%max%"
    - "&7İzleyici: &f%spectators%"

teams:
  red:
    display-name: "&#FF3B3B&lKırmızı"
    plain-name: "KIRMIZI"
  blue:
    display-name: "&#3B6CFF&lMavi"
    plain-name: "MAVİ"

# Arena içindeki oyuncunun kafa üstü adı ve Bukkit displayName değeri.
# TAB satırı ayrı olarak yukarıdaki "tab" bölümünden yönetilir.
name-tag:
  enabled: true
  # Kafa üstünde takım adı + oyuncu adı görünür.
  # Örnek: [KIRMIZI] Oyuncu / [MAVİ] Oyuncu
  prefix:
    red: "&#FF3B3B&l[KIRMIZI] &#FF6B6B"
    blue: "&#3B6CFF&l[MAVİ] &#6B8CFF"
    spectator: "&7&l[İZLEYİCİ] &f"
  suffix:
    red: ""
    blue: ""
    spectator: ""
  display-name:
    red: "&#FF3B3B&l[KIRMIZI] &#FF6B6B%player%"
    blue: "&#3B6CFF&l[MAVİ] &#6B8CFF%player%"
    spectator: "&7&l[İZLEYİCİ] &f%player%"

# Maç sonu ödülleri konsol komutları ile verilir.
# İstediğin ekonomi/crate/item eklentisinin komutunu buraya yazabilirsin.
# Placeholderlar: %player%, %uuid%, %arena%, %team%, %red%, %blue%
rewards:
  winner:
    enabled: true
    commands:
      - "give %player% emerald 5"
      # Ekonomi kullanıyorsan örnek: "eco give %player% 100"
    messages:
      - "&8[&6Football&8] &aKazandığın için &e5 Zümrüt &akazandın!"
  draw:
    enabled: true
    commands:
      - "give %player% emerald 2"
      # Ekonomi kullanıyorsan örnek: "eco give %player% 40"
    messages:
      - "&8[&6Football&8] &eMaç berabere bitti. &f2 Zümrüt &ekazandın!"

# Oyuncunun gerçek zırhı arenaya girerken snapshot'a alınır.
# Arena içinde takım renginde geçici deri set giydirilir ve çıkışta eski zırh geri gelir.
team-armor:
  enabled: true
  lock-inventory: true
  # #RRGGBB veya R,G,B biçimi kullanılabilir.
  red-color: "#FF3B3B"
  blue-color: "#3B6CFF"

goal-selection:
  wand-material: GOLDEN_HOE
  wand-name: "&6Football Kale Seçim Aracı"
  instant-region:
    half-width: 2
    height: 3
    half-depth: 1

